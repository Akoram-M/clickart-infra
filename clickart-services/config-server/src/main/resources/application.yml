server:
  port: 8888

spring:
  application:
    name: config-server
  # Change this to 'git' to use GitHub, or 'native' to use your local folder
  profiles:
    active: git 

---
# This block is only active when profile is 'native' (Development Mode)
spring:
  config:
    activate:
      on-profile: native
  cloud:
    config:
      server:
        native:
          # Point this exactly to where you cloned the repo on your Mac
          search-locations: file:///Users/akorammohandoss/path/to/your/clickart-config-repo

---
# This block is only active when profile is 'git' (Production Mode)
spring:
  config:
    activate:
      on-profile: git
  cloud:
    config:
      server:
        git:
          uri: https://github.com/Akoram-M/clickart-config-repository.git
          default-label: main
          username: Akoram-M
