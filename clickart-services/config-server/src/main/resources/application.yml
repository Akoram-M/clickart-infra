spring:
  config:
    activate:
      on-profile: native
  cloud:
    config:
      server:
        native:
          search-locations: /Users/akorammohandoss/workspace/backend/Clickart/clickart-config-repository

---
spring:
  config:
    activate:
      on-profile: docker
  # No git properties needed here. Docker Compose injects them automatically at runtime.