apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
  namespace: clickart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
      - name: product-service
        image: clickart/product-service:1.0
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: CONFIG_SERVER_URL
          value: "http://clickart-config-server:8888"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: clickart-product-service
  namespace: clickart
spec:
  selector:
    app: product-service
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080