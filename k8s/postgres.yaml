apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: clickart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_USER
          value: test
        - name: POSTGRES_PASSWORD
          value: test
        - name: POSTGRES_DB
          value: orders_db
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  # CRITICAL: This exact name acts as the DNS resolution inside the cluster
  name: clickart-postgres-1
  namespace: clickart
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432