apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: clickart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
      - name: order-service
        image: clickart/order-service:1.0
        imagePullPolicy: IfNotPresent 
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: CONFIG_SERVER_URL
          value: "http://clickart-config-server:8888"
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: clickart-order-service
  namespace: clickart
spec:
  selector:
    app: order-service
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082