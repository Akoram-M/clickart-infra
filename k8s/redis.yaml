apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: clickart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7.0-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: clickart-redis-1 # CRITICAL: Matches your Spring Boot config exactly
  namespace: clickart
spec:
  selector:
    app: redis
  ports:
    - protocol: TCP
      port: 6379
      targetPort: 6379