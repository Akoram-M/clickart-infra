apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
  labels:
    # This label tells the Helm chart to auto-inject this file
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://monitoring-kube-prometheus-prometheus:9090
      isDefault: true
      version: 1
      editable: false
    - name: Loki
      type: loki
      access: proxy
      url: http://loki:3100
      version: 1
      editable: false