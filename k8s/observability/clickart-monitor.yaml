apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clickart-microservices-monitor
  namespace: clickart
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      metrics: enabled
  namespaceSelector:
    matchNames:
      - clickart
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
