apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: clickart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
      - name: inventory-service
        image: clickart/inventory-service:1.0 
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: CONFIG_SERVER_URL
          value: "http://clickart-config-server:8888"
        ports:
        - containerPort: 8084
---
apiVersion: v1
kind: Service
metadata:
  name: clickart-inventory-service
  namespace: clickart
  labels:
    app: inventory-service
    metrics: enabled # 1. ADDED: Label for the ServiceMonitor to find
spec:
  selector:
    app: inventory-service
  ports:
    - name: http          # 2. ADDED: Port name for the ServiceMonitor to bind to
      protocol: TCP
      port: 8084
      targetPort: 8084