apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: clickart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
      - name: discovery-server
        image: clickart/discovery-server:1.0 
        imagePullPolicy: IfNotPresent
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: CONFIG_SERVER_URL
          value: "http://clickart-config-server:8888"
        ports:
        - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: clickart-discovery-server 
  namespace: clickart
spec:
  selector:
    app: discovery-server
  ports:
    - protocol: TCP
      port: 8761
      targetPort: 8761