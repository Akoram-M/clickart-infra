apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: clickart
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:23.0
        args: ["start-dev","--import-realm"]
        env:
        - name: KEYCLOAK_ADMIN
          value: test
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: test
        ports:
        - containerPort: 8080
        # 1. MOUNT THE DIRECTORY INTO THE CONTAINER
        volumeMounts:
        - name: realm-config-volume
          mountPath: /opt/keycloak/data/import
      # 2. DEFINE THE CONFIGMAP AS A VOLUME
      volumes:
      - name: realm-config-volume
        configMap:
          name: keycloak-realm-config
---
apiVersion: v1
kind: Service
metadata:
  name: clickart-keycloak-1
  namespace: clickart
spec:
  selector:
    app: keycloak
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080