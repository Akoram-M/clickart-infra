apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clickart-ingress
  namespace: clickart
spec:
  ingressClassName: nginx
  rules:
  - http:
        paths:
        # Rule 1: Route Keycloak Auth Traffic
        - path: /realms
          pathType: Prefix
          backend:
            service:
              name: clickart-keycloak-1
              port:
                number: 8080
        # Rule 2: Route Application API Traffic
        - path: /
          pathType: Prefix
          backend:
            service:
              name: clickart-api-gateway
              port:
                number: 8083