services:
  # 1. PostgreSQL (Relational Data)
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: orders_db
    ports:
      - "5434:5432"
    volumes:
          # This mounts your init script. Postgres runs everything in this folder on first boot.
          - ./postgres-init:/docker-entrypoint-initdb.d
          # Optional but recommended: Persist database data on your local machine
          - postgres-data:/var/lib/postgresql/data

  # 2. MongoDB (Document Data)
  mongodb:
    image: mongo:7.0
    container_name: clickart-mongodb-1
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
      MONGO_INITDB_DATABASE: product_db
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
      
  # 3. Keycloak (Identity & Access Management)
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev # Runs Keycloak in development mode
    environment:
      KEYCLOAK_ADMIN: test
      KEYCLOAK_ADMIN_PASSWORD: test
    ports:
      - "8081:8080" # Mapped to 8081 so it doesn't clash with Spring Boot on 8080

# 4. Kafka (Official Apache Kafka - KRaft mode)
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    
# Define Docker volumes so your data survives when you turn off the containers
volumes:
  postgres-data:
  mongo-data: