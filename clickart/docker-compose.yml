version: '3.8'

services:
  # ==========================================
  # PHASE 1: CORE INFRASTRUCTURE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: clickart-postgres-1
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: orders_db
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7.0
    container_name: clickart-mongodb-1
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
      MONGO_INITDB_DATABASE: product_db
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: clickart-keycloak-1
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: test
      KEYCLOAK_ADMIN_PASSWORD: test
    ports:
      - "8081:8080"

  kafka:
    image: apache/kafka:3.7.0
    container_name: clickart-kafka-1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER_INTERNAL://clickart-kafka-1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # ==========================================
  # PHASE 2: CONFIGURATION & DISCOVERY
  # ==========================================
  config-server:
    image: clickart/config-server:1.0
    container_name: clickart-config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      # CRITICAL: Replace YOUR_GITHUB_USERNAME below!
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/Akoram-M/clickart-config-repository.git
      - SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME=Akoram-M
      - SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD=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
      # CRITICAL: Forces Config Server to check 'main' instead of 'master'
      - SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL=main
    restart: on-failure

  discovery-server:
    image: clickart/discovery-server:1.0
    container_name: clickart-discovery-server
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
    depends_on:
      - config-server
    restart: on-failure

  # ==========================================
  # PHASE 3: DOMAIN MICROSERVICES
  # ==========================================
  product-service:
    image: clickart/product-service:1.0
    container_name: clickart-product-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - SPRING_DATA_MONGODB_URI=mongodb://test:test@clickart-mongodb-1:27017/product_db?authSource=admin
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
    depends_on:
      - mongodb
      - config-server
      - discovery-server
    restart: on-failure

  inventory-service:
    image: clickart/inventory-service:1.0
    container_name: clickart-inventory-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://clickart-postgres-1:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=test
      - SPRING_DATASOURCE_PASSWORD=test
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
    depends_on:
      - postgres
      - config-server
      - discovery-server
    restart: on-failure
    
  order-service:
    image: clickart/order-service:1.0
    container_name: clickart-order-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://clickart-postgres-1:5432/orders_db
      - SPRING_DATASOURCE_USERNAME=test
      - SPRING_DATASOURCE_PASSWORD=test
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=clickart-kafka-1:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
    depends_on:
      - postgres
      - kafka
      - config-server
      - discovery-server
    restart: on-failure

  notification-service:
    image: clickart/notification-service:1.0
    container_name: clickart-notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=clickart-kafka-1:9092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
    depends_on:
      - kafka
      - config-server
      - discovery-server
    restart: on-failure

  # ==========================================
  # PHASE 4: THE EDGE (API GATEWAY)
  # ==========================================
  api-gateway:
    image: clickart/api-gateway:1.0
    container_name: clickart-api-gateway
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://clickart-keycloak-1:8080/realms/clickart-realm/protocol/openid-connect/certs
    depends_on:
      - keycloak
      - config-server
      - discovery-server
      - product-service
      - order-service
      - inventory-service
    restart: on-failure

volumes:
  postgres-data:
  mongo-data: