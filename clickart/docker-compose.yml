version: '3.8'

services:
  # ==========================================
  # PHASE 1: CORE INFRASTRUCTURE
  # ==========================================
  postgres:
    image: postgres:15-alpine
    container_name: clickart-postgres-1
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5434:5432"
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=4"
      - "-c"
      - "max_replication_slots=4"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: clickart-mongodb-1
    environment:
      MONGO_INITDB_ROOT_USERNAME: test
      MONGO_INITDB_ROOT_PASSWORD: test
      MONGO_INITDB_DATABASE: product_db
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: clickart-keycloak-1
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: test
      KEYCLOAK_ADMIN_PASSWORD: test
    ports:
      - "8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: clickart-kafka-1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,DOCKER_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER_INTERNAL://clickart-kafka-1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,DOCKER_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.0-alpine
    container_name: clickart-redis-1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ==========================================
  # CDC ENGINE (DEBEZIUM KAFKA CONNECT)
  # ==========================================
  kafka-connect:
    image: debezium/connect:2.5
    container_name: clickart-debezium
    ports:
      - "8084:8083" # Mapped to 8084 to prevent conflict with api-gateway on 8083
    environment:
      BOOTSTRAP_SERVERS: clickart-kafka-1:29092
      GROUP_ID: 1
      CONFIG_STORAGE_TOPIC: debezium_connect_configs
      OFFSET_STORAGE_TOPIC: debezium_connect_offsets
      STATUS_STORAGE_TOPIC: debezium_connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: on-failure

  # ==========================================
  # PHASE 2: CONFIGURATION & DISCOVERY
  # ==========================================
  config-server:
    image: clickart/config-server:1.0
    container_name: clickart-config-server
    ports:
      - "8888:8888"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - ENCRYPT_KEY=clickart_master_secret_key_2026
      - SPRING_CLOUD_CONFIG_SERVER_GIT_URI=https://github.com/Akoram-M/clickart-config-repository.git
      - SPRING_CLOUD_CONFIG_SERVER_GIT_USERNAME=Akoram-M
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://clickart-zipkin:9411/api/v2/spans
      - SPRING_CLOUD_CONFIG_SERVER_GIT_PASSWORD={cipher}2d5754213edf05d893efa0a20ed2b45d93723703e10c894ea4c8da3e43b57ba7daba1406d0c6eeead7abd247faf3eec56c024af1429daaf234a54cf3442b1087
      - SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL=main
    restart: on-failure

  discovery-server:
    image: clickart/discovery-server:1.0
    container_name: clickart-discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8761/eureka/apps || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
    depends_on:
      config-server:
        condition: service_started
    restart: on-failure

  # ==========================================
  # PHASE 3: DOMAIN MICROSERVICES
  # ==========================================
  product-service:
    image: clickart/product-service:1.0
    container_name: clickart-product-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - SPRING_DATA_MONGODB_URI=mongodb://test:test@clickart-mongodb-1:27017/product_db?authSource=admin
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
    depends_on:
      mongodb:
        condition: service_started
      config-server:
        condition: service_started
      discovery-server:
        condition: service_healthy
    restart: on-failure

  inventory-service:
    image: clickart/inventory-service:1.0
    container_name: clickart-inventory-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://clickart-postgres-1:5432/inventory_db
      - SPRING_DATASOURCE_USERNAME=test
      - SPRING_DATASOURCE_PASSWORD=test
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=clickart-kafka-1:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_healthy
    restart: on-failure
    
  order-service:
    image: clickart/order-service:1.0
    container_name: clickart-order-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - SPRING_DATASOURCE_URL=jdbc:postgresql://clickart-postgres-1:5432/orders_db
      - SPRING_DATASOURCE_USERNAME=test
      - SPRING_DATASOURCE_PASSWORD=test
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=clickart-kafka-1:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_healthy
    restart: on-failure

  notification-service:
    image: clickart/notification-service:1.0
    container_name: clickart-notification-service
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=clickart-kafka-1:29092
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
    depends_on:
      kafka:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_healthy
    restart: on-failure

  # ==========================================
  # PHASE 4: THE EDGE (API GATEWAY)
  # ==========================================
  api-gateway:
    image: clickart/api-gateway:1.0
    container_name: clickart-api-gateway
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - CONFIG_SERVER_URL=http://clickart-config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://clickart-discovery-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://clickart-keycloak-1:8080/realms/clickart-realm/protocol/openid-connect/certs
    depends_on:
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      config-server:
        condition: service_started
      discovery-server:
        condition: service_healthy
      product-service:
        condition: service_started
      order-service:
        condition: service_started
      inventory-service:
        condition: service_started
    restart: on-failure

  # ==========================================
  # PHASE 5: THE OBSERVABILITY MATRIX
  # ==========================================
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: clickart-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api-gateway

  grafana:
    image: grafana/grafana:10.0.3
    container_name: clickart-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: clickart-zipkin
    ports:
      - "9411:9411"

  # ==========================================
  # PHASE 6: CENTRALIZED LOGGING
  # ==========================================
  loki:
    image: grafana/loki:2.9.0
    container_name: clickart-loki
    ports:
      - "3100:3100"

  promtail:
    image: grafana/promtail:2.9.0
    container_name: clickart-promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

volumes:
  postgres-data:
  mongo-data:
  redis_data:
  keycloak-data: