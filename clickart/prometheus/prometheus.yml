global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'clickart-microservices'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: 
        - 'clickart-api-gateway:8083'
        - 'clickart-product-service:8080'
        - 'clickart-order-service:8082'
        - 'clickart-inventory-service:8084'
        - 'clickart-notification-service:8085'